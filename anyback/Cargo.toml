# anyback
#
# SPDX-FileCopyrightText: 2025-2026 Steve Schoettler
# SPDX-License-Identifier: Apache-2.0

[package]
name = "anyback"
version.workspace = true
authors.workspace = true
categories = ["command-line-utilities"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "backup", "cli"]
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
description = "Backup and restore for Anytype"

[lib]
name = "anyback_reader"
path = "src/lib.rs"

[[test]]
name = "e2e_backup_restore"
path = "tests/e2e_backup_restore.rs"
required-features = ["cli"]

[[test]]
name = "integrity_nightly"
path = "tests/integrity_nightly.rs"
required-features = ["cli"]

[[test]]
name = "object_generator"
path = "tests/object_generator.rs"
required-features = ["cli"]

[[test]]
name = "p1_cross_space"
path = "tests/p1_cross_space.rs"
required-features = ["cli"]

[[test]]
name = "priority_groups"
path = "tests/priority_groups.rs"
required-features = ["cli"]

[[test]]
name = "restore_matrix"
path = "tests/restore_matrix.rs"
required-features = ["cli"]

[[test]]
name = "required_live_gate"
path = "tests/required_live_gate.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
  "dep:chrono",
  "dep:clap",
  "dep:serde_json",
  "dep:prost-types",
  "dep:tokio",
  "dep:tracing",
  "dep:indicatif",
  "dep:tonic",
  "dep:prost",
  "dep:same-file",
]
tui = [
  "cli",
  "dep:arboard",
  "dep:crossterm",
  "dep:image",
  "dep:lru",
  "dep:ratatui",
  "dep:ratatui-image",
]
# waiting on anytype-heart bug fix before re-enabling snapshot import mode
snapshot-import = []

[dependencies]
anyhow.workspace = true
anytype.workspace = true
anytype-rpc.workspace = true
arboard = { version = "3.6", optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
image = { version = "0.25.10", optional = true }
indicatif = { version = "0.18.6", optional = true }
lru = { version = "0.18.2", optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults", "tokio"], optional = true }
same-file = { version = "1.0.6", optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zip = "8.6.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.31.1", default-features = false, features = ["fs"] }

[dev-dependencies]
rand = "0.10.2"
tempfile = "3.27.0"
zeroize.workspace = true
