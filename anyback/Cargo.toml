# SPDX-License-Identifier: Apache-2.0

[package]
name = "anyback"
version = "0.5.0-pre.1"
authors.workspace = true
categories = ["command-line-utilities"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "backup", "cli"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Backup and restore CLI for Anytype"

[[bin]]
name = "anyback"
required-features = ["cli"]

[lib]
name = "anyback_reader"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = [
  # "dep:anytype",
  # "dep:anytype-rpc",
  "dep:chrono",
  "dep:clap",
  "dep:crossterm",
  "dep:image",
  "dep:serde_json",
  "dep:prost-types",
  "dep:ratatui",
  "dep:ratatui-image",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:indicatif",
  "dep:tempfile",
  "dep:tonic",
  "dep:prost",
  "dep:lru",
  "dep:arboard",
]
# waiting on anytype-heart bug fix before re-enabling snapshot import mode
snapshot-import = []

[dependencies]
anyhow.workspace = true
anytype.workspace = true
anytype-rpc.workspace = true
arboard = { version = "3.6", optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
image = { version = "0.25.10", optional = true }
indicatif = { version = "0.18.6", optional = true }
lru = { version = "0.18.1", optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults", "tokio"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tempfile = { version = "3.27.0", optional = true }
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
zip = "8.6.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.31.1", default-features = false, features = ["fs"] }

[dev-dependencies]
rand = "0.10.2"
