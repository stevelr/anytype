# Anytype Toolbox
#
# SPDX-FileCopyrightText: 2025-2026 Steve Schoettler
# SPDX-License-Identifier: Apache-2.0

[workspace]
members = ["any-edit", "any-mcp", "anyback", "anyr", "anytype-api", "anytype-rpc"]
default-members = ["anyr"]
resolver = "3"

[workspace.package]
version = "0.5.0-pre.6"
authors = ["Steve Schoettler <stevelr-git@pm.me>"]
edition = "2024"
homepage = "https://github.com/stevelr/anytype"
license = "Apache-2.0"
repository = "https://github.com/stevelr/anytype"

[workspace.dependencies]
any-edit = { version = "0.5.0-pre.6", path = "./any-edit" }
any-mcp = { version = "0.5.0-pre.6", path = "./any-mcp" }
anyback_reader = { package = "anyback", version = "0.5.0-pre.6", path = "./anyback", default-features = false }
anytype = { version = "0.5.0-pre.6", path = "./anytype-api" }
anytype-rpc = { version = "0.5.0-pre.6", path = "./anytype-rpc" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base16ct = "1.0.0"
base64 = "0.23.1"
bytes = "1.12.1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
db-keystore = "0.5.1"
fs2 = "0.4.3"
futures = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
icu_properties = "2.2.0"
# for jsonwebtoken 11.0, use aws_lc_rs backend instead of rust_crypto
# rust-crypto uses rsa 0.9.10 which has security advisory (as of 2026-08-19)
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
keyring-core = { version = "1.0.0", features = ["sample"] }
libc = "0.2.183"
mime = "0.3.17"
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "rustls", "query"] }
rmcp = { version = "3.1.3", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
subtle = "2.6.1"
test-log = { version = "0.2.21", features = ["log", "trace"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "0.9.12"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }
zeroize = { version = "1.9.0", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
