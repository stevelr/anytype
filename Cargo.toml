# Anytype Rust Tools and Clients
#
# SPDX-FileCopyrightText: 2025-2026 Steve Schoettler
# SPDX-License-Identifier: Apache-2.0

[workspace]
members = ["any-edit", "any-mcp", "anyback", "anyr", "anytype-api", "anytype-rpc"]
resolver = "3"

[workspace.package]
version = "0.5.0-pre.1"
authors = ["Steve Schoettler <stevelr-git@pm.me>"]
edition = "2024"
homepage = "https://github.com/stevelr/anytype"
license = "Apache-2.0"
repository = "https://github.com/stevelr/anytype"

[workspace.dependencies]
anytype = { version = "0.5.0-pre.1", path = "./anytype-api" }
anytype-rpc = { version = "0.5.0-pre.1", path = "./anytype-rpc" }

anyhow = "1.0.104"
base16ct = "1.0.0"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
crossterm = "0.29.0"
db-keystore = { version = "0.5.0-pre.2" }
fs2 = "0.4.3"
futures = "0.3.33"
getrandom = "0.4.3"
httpdate = "1.0.3"
icu_properties = "2.2.0"
keyring-core = { version = "1.0.0", features = ["sample"] }
libc = "0.2.183"
mime = "0.3.17"
parking_lot = "0.12.5"
prost = "0.14.4"
prost-types = "0.14.4"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "rustls", "query"] }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
test-log = { version = "0.2.21", features = ["log", "trace"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "0.9.12"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
zeroize = { version = "1.9.0", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
