[package]
name = "anyr"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "cli"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "CLI for Anytype - list, search, and perform CRUD operations on Anytype objects."

[features]
default = ["mcp", "inspect"]
mcp = ["dep:any-mcp"]
backup = ["dep:anyback_reader", "anyback_reader/cli"]
inspect = ["backup", "anyback_reader/tui"]

[[bin]]
name = "anyr"

[dependencies]
any-edit.workspace = true
any-mcp = { workspace = true, optional = true }
anyback_reader = { workspace = true, optional = true }
anyhow.workspace = true
anytype.workspace = true
base64.workspace = true
bip39 = "2"
bs58 = "0.5"
clap.workspace = true
ed25519-dalek = "3.0.0"
futures.workspace = true
hmac = "0.13.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hex = "0.4"
