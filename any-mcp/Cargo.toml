# any-mcp
#
# SPDX-FileCopyrightText: 2026 Steve Schoettler
# SPDX-License-Identifier: Apache-2.0

[package]
name = "any-mcp"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "mcp"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Bounded, workflow-oriented Model Context Protocol server for Anytype."

[[bin]]
name = "any-mcp"

[[bin]]
name = "any-mcp-views-write-acceptance"
path = "src/bin/views_write_acceptance.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "any-mcp-discussions-acceptance"
path = "src/bin/discussions_acceptance.rs"
required-features = ["acceptance-harness"]

[features]
default = []
# Builds a test-only stdio child with deterministic acceptance seams around the
# same collection-membership handlers used by the linked views-write registry.
acceptance-harness = []

[dependencies]
anytype.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
httpdate.workspace = true
mime.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiktoken-rs = "0.12.0"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
futures-util = "0.3.33"
jsonschema = { version = "0.48.2", default-features = false }
reqwest.workspace = true
serial_test = "3.5.0"
