[package]
name = "any-mcp"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "mcp"]
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Bounded, workflow-oriented Model Context Protocol server for Anytype."

[[bin]]
# Process-level integration tests need a child executable without restoring a
# production any-mcp binary. The user-facing entrypoint is `anyr mcp`.
name = "any-mcp-process-test"
path = "src/bin/process_test.rs"

[[bin]]
name = "any-mcp-views-write-acceptance"
path = "src/bin/views_write_acceptance.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "any-mcp-discussions-acceptance"
path = "src/bin/discussions_acceptance.rs"
required-features = ["acceptance-harness"]

[features]
default = []
# Builds a test-only stdio child with deterministic acceptance seams around the
# same collection-membership handlers used by the linked views-write registry.
acceptance-harness = []

[dependencies]
anytype.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
fs2.workspace = true
futures.workspace = true
getrandom.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
icu_properties.workspace = true
jsonwebtoken.workspace = true
libc.workspace = true
mime.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tiktoken-rs = "0.12.0"
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
anytype = { workspace = true, features = ["test-fixtures"] }
futures-util = "0.3.33"
jsonschema = { version = "0.48.2", default-features = false }
reqwest.workspace = true
serial_test = "3.5.0"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
