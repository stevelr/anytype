[package]
name = "any-mcp"
version.workspace = true
authors.workspace = true
categories = ["api-bindings"]
edition.workspace = true
homepage.workspace = true
keywords = ["anytype", "mcp", "mcp-server", "llm", "automation"]
license.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
description = "Bounded, workflow-oriented Model Context Protocol server for Anytype."

[package.metadata.dist]
# anyr is the only user-facing executable. The binaries below are private
# child-process targets required by integration tests.
dist = false

[[bin]]
# Process-level integration tests need a child executable without restoring a
# production any-mcp binary. The user-facing entrypoint is `anyr mcp`.
name = "any-mcp-process-test"
path = "src/bin/process_test.rs"

[[bin]]
# Tiny scripted validator used by the FLOOD acceptance cases: production
# pins validator executables under a 128 MiB hash ceiling, which the debug
# process-test binary exceeds.
name = "any-mcp-validator-fixture"
path = "src/bin/validator_fixture.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "any-mcp-views-write-acceptance"
path = "src/bin/views_write_acceptance.rs"
required-features = ["acceptance-harness"]

[[bin]]
name = "any-mcp-discussions-acceptance"
path = "src/bin/discussions_acceptance.rs"
required-features = ["acceptance-harness"]

[[bin]]
# Private, operator-driven comparison harness. Release measurements require a
# protected Linux supervisor and are not part of ordinary builds.
name = "any-mcp-benchmark"
path = "src/bin/benchmark/main.rs"
required-features = ["benchmark-harness"]

[features]
default = []
# Builds a test-only stdio child with deterministic acceptance seams around the
# same collection-membership handlers used by the linked views-write registry.
acceptance-harness = []
# Builds the private benchmark runner and its portable fake-child tests.
benchmark-harness = ["dep:benchmark-flate2"]

[dependencies]
anytype.workspace = true
axum.workspace = true
base64.workspace = true
# The private benchmark's npm provenance decoder is feature scoped.
benchmark-flate2 = { package = "flate2", version = "1.1.2", optional = true }
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
fs2.workspace = true
futures.workspace = true
getrandom.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
hyper-util.workspace = true
icu_properties.workspace = true
jsonwebtoken.workspace = true
libc.workspace = true
mime.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
subtle.workspace = true
tiktoken-rs = "0.12.0"
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-general-category.workspace = true
unicode-normalization.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
anytype = { workspace = true, features = ["test-fixtures"] }
futures-util = "0.3.34"
jsonschema = { version = "0.50.0", default-features = false }
reqwest.workspace = true
serial_test = "4.0.1"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
