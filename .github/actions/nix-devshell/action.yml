name: Nix devshell
description: >-
  Install pinned Nix and promote the devshell environment (rust toolchain,
  python, protobuf, gate, anytype-cli PATH plus the compiler-wrapper and SDK
  configuration) to the job environment so later steps can run the pinned
  tools without a `nix develop` wrapper.

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    - name: Expose pinned devshell environment to the job
      shell: bash
      run: |
        outer_env="$(mktemp "${RUNNER_TEMP:-/tmp}/outer-env.XXXXXX")"
        env -0 > "$outer_env"
        nix develop --command bash .github/scripts/export-devshell-env.sh "$outer_env"
        rm -f -- "$outer_env"
