name: Documentation site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/docs-site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the checked site to Cloudflare Pages
        required: true
        type: boolean
        default: false

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  check:
    name: Build and check Zola site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5c # v4.3.1

      - name: Install pinned Zola
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" zola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check links and content
        working-directory: site
        run: zola check

      - name: Build production site
        working-directory: site
        run: zola build --output-dir ../target/docs-site

      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.deploy &&
          github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/docs-site --project-name=anytype-toolbox --branch=main
