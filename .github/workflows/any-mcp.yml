# Cross-platform regression gates for the bounded Anytype MCP server.

name: any-mcp

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: Test tier to run after portable contracts
        type: choice
        required: true
        default: portable
        options:
          - portable
          - live
          - clean-server
          - all

permissions:
  contents: read

concurrency:
  group: any-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANYTYPE_TEST_SPACE_PREFIX: xtest

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify pinned CI prerequisites
        run: nix develop --command bash .github/scripts/verify-ci-prerequisites.sh --check-repository

  portable-contracts:
    # One row per released target of the artifact data-plane platform matrix:
    # Linux x86_64/aarch64, macOS aarch64, and Windows x86_64/aarch64.
    name: contracts, stdio, and artifacts (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-11-arm
            platform: windows-aarch64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Install Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-${{ matrix.platform }}

      - name: Run schema, catalog, token-budget, and unit tests
        timeout-minutes: 30
        run: cargo test --locked -p any-mcp --lib

      - name: Verify the ignored live-test inventory and workflow pins
        run: cargo test --locked -p any-mcp --test live_gate_manifest

      - name: Verify private live-gate helper failure behavior
        if: runner.os == 'Linux'
        run: |
          python3 any-mcp/scripts/test_live_gate_security.py
          bash -n any-mcp/scripts/run-live-cgroup.sh

      - name: Run portable production-process and stdio conformance tests
        timeout-minutes: 30
        run: cargo test --locked -p any-mcp --features acceptance-harness --test process_runtime --test stdio_conformance --test headless_stdio_e2e --test discussions_stdio_acceptance

      # Both artifact control planes are compiled from the same acceptance
      # harness, so each is executed once per platform: the library plane also
      # locks the exact artifact catalog and schema snapshots, and the harness
      # target adds the adversarial case matrix. Live rows stay ignored here
      # because a real Anytype backend is required to run them.
      - name: Run artifact acceptance and adversarial suites with exact catalog snapshots
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p any-mcp --features acceptance-harness --lib artifact -- --test-threads=1
          cargo test --locked -p any-mcp --features acceptance-harness --test headless_stdio_e2e artifact -- --test-threads=1

  headless-e2e:
    name: stdio to headless Anytype
    if: ${{ inputs.tier == 'live' || inputs.tier == 'all' || github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: portable-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Later steps need the pinned toolchain, python, and anytype-cli outside
      # a `nix develop` wrapper, so the devshell PATH is promoted to the job.
      - name: Expose pinned devshell tools to the job
        run: |
          nix develop --command bash -euo pipefail -c '
            {
              printf "PATH=%s\n" "$PATH"
              printf "PROTOC=%s\n" "$PROTOC"
              printf "PROTOC_INCLUDE=%s\n" "$PROTOC_INCLUDE"
            } >> "$GITHUB_ENV"
          '

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-headless

      # GitHub-hosted runners start without a systemd user manager session,
      # which the transient-scope wrapper (run-live-cgroup.sh) requires.
      - name: Enable the systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-user-session
          sudo loginctl enable-linger "$(whoami)"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 30); do
            [[ -S "$runtime_dir/bus" ]] && break
            sleep 1
          done
          [[ -S "$runtime_dir/bus" ]] || { printf '%s\n' "user session bus did not appear" >&2; exit 1; }
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir"
          } >> "$GITHUB_ENV"

      - name: Verify transient user-scope support
        shell: bash
        run: |
          set -euo pipefail
          if ! systemctl --user show-environment >/dev/null 2>&1; then
            printf '%s\n' 'required live cgroup manager unavailable' >&2
            exit 1
          fi

      - name: Prepare private live-gate storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/any-mcp-live-XXXXXX")"
          chmod 0700 "$private_dir"
          printf 'ANY_MCP_LIVE_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Provision an isolated headless server with ephemeral credentials
        shell: bash
        run: bash .github/scripts/provision-headless-server.sh ANY_MCP_HEADLESS

      - name: Run serial production-router and stdio-to-headless gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -n "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REVIEWED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;;
          esac
          unset test_prefix
          context="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context"
          python3 any-mcp/scripts/reviewed-evidence.py start \
            "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE" "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_EVIDENCE_CONTEXT="$context"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER
          ANY_MCP_HEADLESS_LOG_RUN_MARKER="$(sed -n 's/^run_marker=//p' "$context")"
          bash any-mcp/scripts/run-live-cgroup.sh command auth -- \
            cargo run --locked -q -p anyr -- auth status --pretty
          bash any-mcp/scripts/run-live-cgroup.sh test direct -- \
            cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1 --nocapture
          bash any-mcp/scripts/run-live-cgroup.sh test stdio -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test headless_stdio_e2e -- --ignored --test-threads=1 --nocapture
          bash any-mcp/scripts/run-live-cgroup.sh test discussions -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test discussions_stdio_acceptance -- --ignored --test-threads=1 --nocapture

      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANY_MCP_HEADLESS_REVIEWED_LOG_FILE:-}" ]]; then
            printf '%s\n' "no server log was provisioned before the failure" >&2
            exit 0
          fi
          artifact="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-server-events.txt"
          python3 any-mcp/scripts/reviewed-evidence.py capture \
            "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE" \
            "$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context" "$artifact"
          printf 'ANY_MCP_LIVE_FAILURE_EVIDENCE=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Retain bounded reviewed server evidence on failure
        if: ${{ failure() && env.ANY_MCP_LIVE_FAILURE_EVIDENCE != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: any-mcp-headless-reviewed-server-evidence
          path: ${{ env.ANY_MCP_LIVE_FAILURE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Remove private live-gate storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${ANY_MCP_LIVE_PRIVATE_DIR:-}" in
            "$RUNNER_TEMP"/any-mcp-live-??????) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$ANY_MCP_LIVE_PRIVATE_DIR"

  headless-clean-server-soak:
    name: clean-server live gate
    if: ${{ inputs.tier == 'clean-server' || inputs.tier == 'all' }}
    needs: portable-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Later steps need the pinned toolchain, python, and anytype-cli outside
      # a `nix develop` wrapper, so the devshell PATH is promoted to the job.
      - name: Expose pinned devshell tools to the job
        run: |
          nix develop --command bash -euo pipefail -c '
            {
              printf "PATH=%s\n" "$PATH"
              printf "PROTOC=%s\n" "$PROTOC"
              printf "PROTOC_INCLUDE=%s\n" "$PROTOC_INCLUDE"
            } >> "$GITHUB_ENV"
          '

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-headless

      # GitHub-hosted runners start without a systemd user manager session,
      # which the transient-scope wrapper (run-live-cgroup.sh) requires.
      - name: Enable the systemd user manager
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-user-session
          sudo loginctl enable-linger "$(whoami)"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 30); do
            [[ -S "$runtime_dir/bus" ]] && break
            sleep 1
          done
          [[ -S "$runtime_dir/bus" ]] || { printf '%s\n' "user session bus did not appear" >&2; exit 1; }
          {
            printf 'XDG_RUNTIME_DIR=%s\n' "$runtime_dir"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir"
          } >> "$GITHUB_ENV"

      - name: Verify transient user-scope support
        shell: bash
        run: |
          set -euo pipefail
          if ! systemctl --user show-environment >/dev/null 2>&1; then
            printf '%s\n' 'required live cgroup manager unavailable' >&2
            exit 1
          fi

      - name: Prepare private live-gate storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/any-mcp-live-XXXXXX")"
          chmod 0700 "$private_dir"
          printf 'ANY_MCP_LIVE_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      # The disposable per-runner server is always clean, so this tier no
      # longer needs a host-side reset script.
      - name: Provision an isolated headless server with ephemeral credentials
        shell: bash
        run: bash .github/scripts/provision-headless-server.sh ANY_MCP_HEADLESS

      - name: Run all serial production-router and stdio-to-headless targets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -n "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REVIEWED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;;
          esac
          unset test_prefix
          context="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context"
          python3 any-mcp/scripts/reviewed-evidence.py start \
            "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE" "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_EVIDENCE_CONTEXT="$context"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER
          ANY_MCP_HEADLESS_LOG_RUN_MARKER="$(sed -n 's/^run_marker=//p' "$context")"
          bash any-mcp/scripts/run-live-cgroup.sh command auth -- \
            cargo run --locked -q -p anyr -- auth status --pretty
          bash any-mcp/scripts/run-live-cgroup.sh test direct -- \
            cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1 --nocapture
          bash any-mcp/scripts/run-live-cgroup.sh test stdio -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test headless_stdio_e2e -- --ignored --test-threads=1 --nocapture
          bash any-mcp/scripts/run-live-cgroup.sh test discussions -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test discussions_stdio_acceptance -- --ignored --test-threads=1 --nocapture

      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANY_MCP_HEADLESS_REVIEWED_LOG_FILE:-}" ]]; then
            printf '%s\n' "no server log was provisioned before the failure" >&2
            exit 0
          fi
          artifact="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-server-events.txt"
          python3 any-mcp/scripts/reviewed-evidence.py capture \
            "$ANY_MCP_HEADLESS_REVIEWED_LOG_FILE" \
            "$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context" "$artifact"
