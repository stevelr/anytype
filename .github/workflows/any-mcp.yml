# Cross-platform regression gates for the bounded Anytype MCP server.

name: any-mcp

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/any-mcp.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "any-mcp/**"
      - "anytype-api/**"
      - "anytype-rpc/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/any-mcp.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "any-mcp/**"
      - "anytype-api/**"
      - "anytype-rpc/**"

permissions:
  contents: read

jobs:
  portable-contracts:
    name: contracts and stdio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-${{ matrix.os }}

      - name: Run schema, catalog, token-budget, and unit tests
        run: cargo test --locked -p any-mcp --lib

      - name: Verify the ignored live-test inventory and workflow pins
        run: cargo test --locked -p any-mcp --test live_gate_manifest

      - name: Verify private live-gate helper failure behavior
        run: python3 any-mcp/scripts/test_live_gate_security.py

      - name: Run portable production-process and stdio conformance tests
        run: cargo test --locked -p any-mcp --features acceptance-harness --test process_runtime --test stdio_conformance --test headless_stdio_e2e --test discussions_stdio_acceptance

  headless-e2e:
    name: stdio to headless Anytype
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: portable-contracts
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 30
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-headless

      - name: Prepare private live-gate storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/any-mcp-live-XXXXXX")"
          chmod 0700 "$private_dir"
          printf 'ANY_MCP_LIVE_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Run serial production-router and stdio-to-headless gates
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;;
          esac
          unset test_prefix
          context="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context"
          python3 any-mcp/scripts/reviewed-evidence.py start \
            "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE" "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_EVIDENCE_CONTEXT="$context"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER
          ANY_MCP_HEADLESS_LOG_RUN_MARKER="$(sed -n 's/^run_marker=//p' "$context")"
          python3 any-mcp/scripts/run-live-gate.py command auth -- \
            cargo run --locked -q -p anyr -- auth status --pretty
          python3 any-mcp/scripts/run-live-gate.py test direct -- \
            cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1 --nocapture
          python3 any-mcp/scripts/run-live-gate.py test stdio -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test headless_stdio_e2e -- --ignored --test-threads=1 --nocapture
          python3 any-mcp/scripts/run-live-gate.py test discussions -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test discussions_stdio_acceptance -- --ignored --test-threads=1 --nocapture

      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        env:
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          artifact="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-server-events.txt"
          python3 any-mcp/scripts/reviewed-evidence.py capture \
            "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE" \
            "$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context" "$artifact"
          printf 'ANY_MCP_LIVE_FAILURE_EVIDENCE=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Retain bounded reviewed server evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: any-mcp-headless-reviewed-server-evidence
          path: ${{ env.ANY_MCP_LIVE_FAILURE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Remove private live-gate storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${ANY_MCP_LIVE_PRIVATE_DIR:-}" in
            "$RUNNER_TEMP"/any-mcp-live-??????) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$ANY_MCP_LIVE_PRIVATE_DIR"

  headless-clean-server-soak:
    name: clean-server live gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: portable-contracts
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 45
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: any-mcp-headless

      - name: Prepare private live-gate storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "$RUNNER_TEMP/any-mcp-live-XXXXXX")"
          chmod 0700 "$private_dir"
          printf 'ANY_MCP_LIVE_PRIVATE_DIR=%s\n' "$private_dir" >> "$GITHUB_ENV"

      - name: Provision a clean isolated headless server
        shell: bash
        env:
          ANY_MCP_HEADLESS_RESET_SCRIPT: ${{ vars.ANY_MCP_HEADLESS_RESET_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test "${ANY_MCP_HEADLESS_RESET_SCRIPT#/}" != "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test -x "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          python3 any-mcp/scripts/run-live-gate.py command reset -- \
            "$ANY_MCP_HEADLESS_RESET_SCRIPT"

      - name: Run all serial production-router and stdio-to-headless targets
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;;
          esac
          unset test_prefix
          context="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context"
          python3 any-mcp/scripts/reviewed-evidence.py start \
            "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE" "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_EVIDENCE_CONTEXT="$context"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER
          ANY_MCP_HEADLESS_LOG_RUN_MARKER="$(sed -n 's/^run_marker=//p' "$context")"
          python3 any-mcp/scripts/run-live-gate.py command auth -- \
            cargo run --locked -q -p anyr -- auth status --pretty
          python3 any-mcp/scripts/run-live-gate.py test direct -- \
            cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1 --nocapture
          python3 any-mcp/scripts/run-live-gate.py test stdio -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test headless_stdio_e2e -- --ignored --test-threads=1 --nocapture
          python3 any-mcp/scripts/run-live-gate.py test discussions -- \
            cargo test --locked -p any-mcp --features acceptance-harness \
            --test discussions_stdio_acceptance -- --ignored --test-threads=1 --nocapture

      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        env:
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          artifact="$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-server-events.txt"
          python3 any-mcp/scripts/reviewed-evidence.py capture \
            "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE" \
            "$ANY_MCP_LIVE_PRIVATE_DIR/reviewed-context" "$artifact"
          printf 'ANY_MCP_LIVE_FAILURE_EVIDENCE=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Retain bounded reviewed server evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: any-mcp-clean-server-reviewed-evidence
          path: ${{ env.ANY_MCP_LIVE_FAILURE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7

      - name: Remove private live-gate storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${ANY_MCP_LIVE_PRIVATE_DIR:-}" in
            "$RUNNER_TEMP"/any-mcp-live-??????) ;;
            *) exit 1 ;;
          esac
          rm -rf -- "$ANY_MCP_LIVE_PRIVATE_DIR"
