# Cross-platform regression gates for the bounded Anytype MCP server.

name: any-mcp

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/any-mcp.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "any-mcp/**"
      - "anytype-api/**"
      - "anytype-rpc/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/any-mcp.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "any-mcp/**"
      - "anytype-api/**"
      - "anytype-rpc/**"

permissions:
  contents: read

jobs:
  portable-contracts:
    name: contracts and stdio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: any-mcp-${{ matrix.os }}

      - name: Run schema, catalog, token-budget, and unit tests
        run: cargo test --locked -p any-mcp --lib

      - name: Run portable production-process and stdio conformance tests
        run: cargo test --locked -p any-mcp --features acceptance-harness --test process_runtime --test stdio_conformance --test headless_stdio_e2e

  headless-e2e:
    name: stdio to headless Anytype
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 30
    concurrency:
      group: any-mcp-headless
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: any-mcp-headless

      - name: Run serial production-router and stdio-to-headless gates
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE"
          test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          cargo run --locked -q -p anyr -- auth status --pretty
          cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1
          cargo test --locked -p any-mcp --features acceptance-harness --test headless_stdio_e2e -- \
            --ignored --test-threads=1

      - name: Retain redacted headless server evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: any-mcp-headless-server-log
          path: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
          if-no-files-found: warn
          retention-days: 7

  headless-clean-server-soak:
    name: scheduled clean-server soak
    if: github.event_name == 'schedule'
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 45
    concurrency:
      group: any-mcp-headless
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: any-mcp-headless

      - name: Provision a clean isolated headless server
        shell: bash
        env:
          ANY_MCP_HEADLESS_RESET_SCRIPT: ${{ vars.ANY_MCP_HEADLESS_RESET_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test "${ANY_MCP_HEADLESS_RESET_SCRIPT#/}" != "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test -x "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          "$ANY_MCP_HEADLESS_RESET_SCRIPT"

      - name: Run all serial production-router and stdio-to-headless targets
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE"
          test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          cargo run --locked -q -p anyr -- auth status --pretty
          cargo test --locked -p any-mcp --lib headless_ -- \
            --ignored --test-threads=1
          cargo test --locked -p any-mcp --features acceptance-harness --test headless_stdio_e2e -- \
            --ignored --test-threads=1

      - name: Retain redacted clean-server evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: any-mcp-clean-server-log
          path: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
          if-no-files-found: warn
          retention-days: 7
