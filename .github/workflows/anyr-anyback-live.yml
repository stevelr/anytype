# Installed-binary smoke gate for anyr backup and restore.
#
# The gate runs against a disposable headless Anytype server provisioned on
# the GitHub-hosted runner itself: the pinned anytype-cli from the Nix
# devshell serves inside the sync-blocking network namespace created by
# scripts/anytype-nonet, and the run mints its own ephemeral account and API
# key. Nothing outlives the runner: credentials, server state, and logs are
# all disposable, and the namespace blocks all outbound sync traffic so test
# activity never reaches the Anytype network.

name: anyr-anyback-live

on:
  push:
    branches:
      - main
  schedule:
    - cron: "35 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anyr-anyback-live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANYTYPE_TEST_SPACE_PREFIX: xtest

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify pinned CI prerequisites
        run: nix develop --command bash .github/scripts/verify-ci-prerequisites.sh --check-repository

  installed-backup-smoke:
    name: installed anyr backup create/restore
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Later steps need the pinned toolchain, python, and anytype-cli outside
      # a `nix develop` wrapper (background server, sudo namespace helpers),
      # so the devshell PATH and protobuf variables are promoted to the job.
      - name: Expose pinned devshell tools to the job
        run: |
          nix develop --command bash -euo pipefail -c '
            {
              printf "PATH=%s\n" "$PATH"
              printf "PROTOC=%s\n" "$PROTOC"
              printf "PROTOC_INCLUDE=%s\n" "$PROTOC_INCLUDE"
            } >> "$GITHUB_ENV"
          '

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anyr-anyback-live

      # The gate exercises the installed binary, so the install happens first
      # and provisioning reuses it (via ANYR_BIN) for `anyr init-cli`.
      - name: Install anyr
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/installed"
          cargo install --locked --profile dist --path anyr --root "$install_root"
          anyr_bin="$install_root/bin/anyr"
          [[ -x "$anyr_bin" ]] || { printf '%s\n' "installed anyr binary is missing" >&2; exit 1; }
          printf 'ANYR_BIN=%s\n' "$anyr_bin" >> "$GITHUB_ENV"

      - name: Provision an isolated headless server with ephemeral credentials
        shell: bash
        run: bash .github/scripts/provision-headless-server.sh ANYR_ANYBACK_HEADLESS

      - name: Run the required serial live gate
        shell: bash
        run: |
          set -euo pipefail
          fail_preflight() { printf '%s\n' "$1" >&2; exit 1; }
          [[ -n "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file is required"
          [[ "${ANYR_ANYBACK_HEADLESS_ENV_FILE#/}" != "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file must be absolute"
          [[ -r "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file is unreadable"
          [[ -n "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log is required"
          [[ "${ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log must be absolute"
          [[ -r "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log is unreadable"

          set -a
          source "$ANYR_ANYBACK_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          [[ -n "$test_prefix" ]] || fail_preflight "ANYTYPE_TEST_SPACE_PREFIX is required"
          [[ "${#test_prefix}" -le 470 ]] || fail_preflight "ANYTYPE_TEST_SPACE_PREFIX is too long"
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*)
              printf '%s\n' "ANYTYPE_TEST_SPACE_PREFIX must use ASCII letters, digits, hyphens, or underscores" >&2
              exit 1
              ;;
          esac
          unset test_prefix

          umask 077
          gate_dir="$(mktemp -d "$RUNNER_TEMP/anyr-anyback-live-XXXXXX")"
          trap 'rm -rf -- "$gate_dir"' EXIT
          export ANYBACK_HEADLESS_REDACTED_LOG_FILE="$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE"

          export ANYR_BIN
          [[ "${ANYR_BIN#/}" != "$ANYR_BIN" ]] || fail_preflight "installed anyr path must be absolute"
          [[ -x "$ANYR_BIN" ]] || fail_preflight "installed anyr binary is missing"

          run_required_python_gate() {
            local output="$gate_dir/gate-python-cli.log"
            local category_file="$gate_dir/gate-python-cli.category"
            set +e
            env ANYR_PY_REQUIRE_LIVE=1 python3 -B -m anyr.tests.run_required_python_cli \
              --category-file "$category_file" >"$output" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]] || ! python3 -B anyr/tests/live_gate_policy.py python "$output"; then
              local category="required-test-failed"
              if [[ -f "$category_file" && ! -L "$category_file" ]] && \
                [[ "$(stat -c '%u' -- "$category_file")" == "$(id -u)" ]] && \
                [[ "$(stat -c '%a' -- "$category_file")" == "600" ]] && \
                [[ "$(stat -c '%s' -- "$category_file")" -le 64 ]]; then
                category="$(<"$category_file")"
                case "$category" in
                  inventory-invalid|create-ambiguous|identity-mismatch|cleanup-failed|required-test-failed) ;;
                  *) category="required-test-failed" ;;
                esac
              fi
              tail -c 65536 -- "$output" > "$RUNNER_TEMP/anyr-anyback-gate-output.log"
              rm -f -- "$output" "$category_file"
              printf 'required anyr live gate failed: %s\n' "$category" >&2
              return 1
            fi
            rm -f -- "$output" "$category_file"
          }
          run_required_type_property_gate() {
            local output="$gate_dir/gate-type-property.log"
            set +e
            cargo test --locked -p anyr --bins cli::types::tests::live_add_property_preserves_exact_replaceable_set -- \
              --ignored --exact --test-threads=1 --nocapture >"$output" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]] || ! python3 -B anyr/tests/live_gate_policy.py rust "$output"; then
              tail -c 65536 -- "$output" > "$RUNNER_TEMP/anyr-anyback-gate-output.log"
              rm -f -- "$output"
              printf '%s\n' "required anyr type-property gate failed" >&2
              return 1
            fi
            rm -f -- "$output"
          }
          run_required_type_property_gate
          run_required_python_gate

          marker="$gate_dir/callback.marker"
          expected_marker="$gate_dir/callback.expected"
          nonce="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "${#nonce}" -eq 64 ]] || fail_preflight "required gate nonce generation failed"
          printf '%s\n' "$nonce" > "$expected_marker"
          export ANYBACK_REQUIRED_GATE_MARKER="$marker"
          export ANYBACK_REQUIRED_GATE_NONCE="$nonce"

          cargo test --locked -p anyback --test required_live_gate \
            required_installed_anyr_backup_create_restore -- \
            --ignored --exact --test-threads=1 --nocapture
          [[ -f "$marker" ]] || fail_preflight "required gate callback was not invoked"
          cmp --silent "$expected_marker" "$marker" || fail_preflight "required gate callback marker mismatch"

      # The gates run against per-run throwaway credentials on a disposable
      # server, so a bounded copy of the failed gate's output is retainable
      # evidence rather than a secret-exposure risk.
      - name: Retain bounded gate output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anyr-anyback-live-gate-output
          path: ${{ runner.temp }}/anyr-anyback-gate-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture bounded server evidence on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          server_log="${ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE:-}"
          if [[ -z "$server_log" || ! -r "$server_log" ]]; then
            printf '%s\n' "no server log was provisioned before the failure" >&2
            exit 0
          fi
          artifact="$RUNNER_TEMP/anyr-anyback-live-server-tail.log"
          tail -c 65536 -- "$server_log" > "$artifact"
          printf 'ANYBACK_HEADLESS_REDACTED_LOG_ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Retain bounded server evidence on failure
        if: ${{ failure() && env.ANYBACK_HEADLESS_REDACTED_LOG_ARTIFACT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anyr-anyback-live-server-log
          path: ${{ env.ANYBACK_HEADLESS_REDACTED_LOG_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 7
