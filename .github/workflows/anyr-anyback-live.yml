# Protected installed-binary smoke gate for anyr backup and restore.

name: anyr-anyback-live

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/anyr-anyback-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anyr/**"
      - "anyback/**"
      - "anytype-api/**"
      - "anytype-rpc/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/anyr-anyback-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anyr/**"
      - "anyback/**"
      - "anytype-api/**"
      - "anytype-rpc/**"

permissions:
  contents: read

jobs:
  installed-backup-smoke:
    name: installed anyr backup create/restore
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 25
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: anyr-anyback-live

      - name: Install anyr and run the required serial live gate
        shell: bash
        env:
          ANYR_ANYBACK_HEADLESS_ENV_FILE: ${{ vars.ANYR_ANYBACK_HEADLESS_ENV_FILE }}
          ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          fail_preflight() { printf '%s\n' "$1" >&2; exit 1; }
          [[ -n "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file is required"
          [[ "${ANYR_ANYBACK_HEADLESS_ENV_FILE#/}" != "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file must be absolute"
          [[ -r "$ANYR_ANYBACK_HEADLESS_ENV_FILE" ]] || fail_preflight "headless environment file is unreadable"
          [[ -n "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log is required"
          [[ "${ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log must be absolute"
          [[ -r "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" ]] || fail_preflight "redacted server log is unreadable"

          set -a
          source "$ANYR_ANYBACK_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          [[ -n "$test_prefix" ]] || fail_preflight "ANYTYPE_TEST_SPACE_PREFIX is required"
          [[ "${#test_prefix}" -le 470 ]] || fail_preflight "ANYTYPE_TEST_SPACE_PREFIX is too long"
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*)
              printf '%s\n' "ANYTYPE_TEST_SPACE_PREFIX must use ASCII letters, digits, hyphens, or underscores" >&2
              exit 1
              ;;
          esac
          unset test_prefix

          umask 077
          gate_dir="$(mktemp -d "$RUNNER_TEMP/anyr-anyback-live-XXXXXX")"
          trap 'rm -rf -- "$gate_dir"' EXIT
          export ANYBACK_HEADLESS_REDACTED_LOG_FILE="$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE"

          install_root="$gate_dir/installed"
          cargo install --locked --path anyr --root "$install_root"
          export ANYR_BIN="$install_root/bin/anyr"
          [[ "${ANYR_BIN#/}" != "$ANYR_BIN" ]] || fail_preflight "installed anyr path must be absolute"
          [[ -x "$ANYR_BIN" ]] || fail_preflight "installed anyr binary is missing"

          run_required_python_gate() {
            local output="$gate_dir/gate-python-cli.log"
            local category_file="$gate_dir/gate-python-cli.category"
            set +e
            env ANYR_PY_REQUIRE_LIVE=1 python3 -B -m anyr.tests.run_required_python_cli \
              --category-file "$category_file" >"$output" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]] || ! python3 -B anyr/tests/live_gate_policy.py python "$output"; then
              local category="required-test-failed"
              if [[ -f "$category_file" && ! -L "$category_file" ]] && \
                [[ "$(stat -c '%u' -- "$category_file")" == "$(id -u)" ]] && \
                [[ "$(stat -c '%a' -- "$category_file")" == "600" ]] && \
                [[ "$(stat -c '%s' -- "$category_file")" -le 64 ]]; then
                category="$(<"$category_file")"
                case "$category" in
                  inventory-invalid|create-ambiguous|identity-mismatch|cleanup-failed|required-test-failed) ;;
                  *) category="required-test-failed" ;;
                esac
              fi
              rm -f -- "$output" "$category_file"
              printf 'required anyr live gate failed: %s\n' "$category" >&2
              return 1
            fi
            rm -f -- "$output" "$category_file"
          }
          run_required_type_property_gate() {
            local output="$gate_dir/gate-type-property.log"
            set +e
            cargo test --locked -p anyr --bins cli::types::tests::live_add_property_preserves_exact_replaceable_set -- \
              --ignored --exact --test-threads=1 --nocapture >"$output" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 0 ]] || ! python3 -B anyr/tests/live_gate_policy.py rust "$output"; then
              rm -f -- "$output"
              printf '%s\n' "required anyr type-property gate failed" >&2
              return 1
            fi
            rm -f -- "$output"
          }
          run_required_type_property_gate
          run_required_python_gate

          marker="$gate_dir/callback.marker"
          expected_marker="$gate_dir/callback.expected"
          nonce="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          [[ "${#nonce}" -eq 64 ]] || fail_preflight "required gate nonce generation failed"
          printf '%s\n' "$nonce" > "$expected_marker"
          export ANYBACK_REQUIRED_GATE_MARKER="$marker"
          export ANYBACK_REQUIRED_GATE_NONCE="$nonce"

          cargo test --locked -p anyback --test required_live_gate \
            required_installed_anyr_backup_create_restore -- \
            --ignored --exact --test-threads=1 --nocapture
          [[ -f "$marker" ]] || fail_preflight "required gate callback was not invoked"
          cmp --silent "$expected_marker" "$marker" || fail_preflight "required gate callback marker mismatch"

      - name: Capture bounded redacted server evidence on failure
        if: failure()
        shell: bash
        env:
          ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/anyr-anyback-live-server-tail.log"
          tail -c 65536 -- "$ANYR_ANYBACK_HEADLESS_REDACTED_LOG_FILE" > "$artifact"
          chmod 0600 "$artifact"
          printf 'ANYBACK_HEADLESS_REDACTED_LOG_ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"

      - name: Retain bounded redacted server evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anyr-anyback-live-server-log
          path: ${{ env.ANYBACK_HEADLESS_REDACTED_LOG_ARTIFACT }}
          if-no-files-found: warn
          retention-days: 7
