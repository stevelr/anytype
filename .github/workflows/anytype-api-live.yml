name: anytype-api live

on:
  push:
    branches:
      - main
  schedule:
    - cron: "29 2 * * *"
    - cron: "43 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Live tier to run after inventory validation
        type: choice
        required: true
        default: required
        options:
          - required
          - soak
          - all

permissions:
  contents: read

concurrency:
  group: anytype-api-live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANYTYPE_TEST_SPACE_PREFIX: xtest

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify pinned CI prerequisites
        run: nix develop --command bash .github/scripts/verify-ci-prerequisites.sh --check-repository

  ignored-test-inventory:
    name: disposable ignored-test inventory
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-inventory
      - name: Verify the closed ignored-test inventory and workflow policy
        run: |
          cargo test --locked -p anytype --test live_gate_manifest
          PYTHONDONTWRITEBYTECODE=1 python3 anytype-api/scripts/test_run_live_gate.py

  headless-required:
    name: protected disposable required tier
    if: ${{ inputs.tier == 'required' || inputs.tier == 'all' || github.event_name == 'push' || github.event.schedule == '29 2 * * *' }}
    needs: ignored-test-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Later steps need the pinned toolchain, python, and anytype-cli outside
      # a `nix develop` wrapper, so the devshell PATH is promoted to the job.
      - name: Expose pinned devshell tools to the job
        run: |
          nix develop --command bash -euo pipefail -c '
            {
              printf "PATH=%s\n" "$PATH"
              printf "PROTOC=%s\n" "$PROTOC"
              printf "PROTOC_INCLUDE=%s\n" "$PROTOC_INCLUDE"
            } >> "$GITHUB_ENV"
          '
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-headless
      - name: Provision an isolated headless server with ephemeral credentials
        shell: bash
        run: bash .github/scripts/provision-headless-server.sh ANY_MCP_HEADLESS
      - name: Run required disposable ignored tests serially
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a; source "$ANY_MCP_HEADLESS_ENV_FILE"; set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;; esac
          test "${ANYTYPE_KEYSTORE:-}" = env
          test -n "${ANYTYPE_KEYSTORE_SERVICE:-}" && test "${#ANYTYPE_KEYSTORE_SERVICE}" -le 128
          case "$ANYTYPE_KEYSTORE_SERVICE" in [!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]*) exit 1 ;; esac
          case "${ANYTYPE_KEYSTORE_SERVICE:1}" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_.-]*) exit 1 ;; esac
          test -n "${ANYTYPE_KEY_HTTP_TOKEN:-}"
          test -n "${ANYTYPE_KEY_SESSION_TOKEN:-${ANYTYPE_KEY_ACCOUNT_KEY:-}}"
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-evidence-XXXXXX")"
          exec {reviewed_fd}<"$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -f "/proc/self/fd/$reviewed_fd"
          IFS='|' read -r start_device start_inode start_bytes < <(stat -Lc '%d|%i|%s' "/proc/self/fd/$reviewed_fd")
          case "$start_device:$start_inode:$start_bytes" in *[!0-9:]*|::|*::|:* ) exit 1 ;; esac
          anchor_length=$(( start_bytes < 4096 ? start_bytes : 4096 ))
          anchor_start=$(( start_bytes - anchor_length ))
          anchor_hash="$(tail -c "$anchor_length" -- "/proc/self/fd/$reviewed_fd" | sha256sum | cut -d ' ' -f 1)"
          exec {reviewed_fd}<&-
          run_marker="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#run_marker}" -eq 64
          context="$evidence_dir/context"
          printf 'run_marker=%s\nstart_device=%s\nstart_inode=%s\nstart_bytes=%s\nanchor_start=%s\nanchor_length=%s\nanchor_hash=%s\n' "$run_marker" "$start_device" "$start_inode" "$start_bytes" "$anchor_start" "$anchor_length" "$anchor_hash" > "$context"
          chmod 0600 "$context"
          printf 'ANYTYPE_API_LIVE_EVIDENCE_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          export ANYTYPE_API_GATE_OUTPUT="$RUNNER_TEMP/anytype-api-gate-output.log"
          python3 anytype-api/scripts/run-live-gate.py required anytype-api/tests/live-gate-manifest.toml
      # Failed-entry output is retainable evidence: the disposable server's
      # credentials are per-run throwaways.
      - name: Retain bounded gate output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anytype-api-gate-output-${{ github.job }}
          path: ${{ runner.temp }}/anytype-api-gate-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        run: |
          set +e
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-failure-XXXXXX" 2>/dev/null)" || exit 1
          artifact="$evidence_dir/reviewed-server-events.txt"
          marker=unavailable; start_device=unavailable; start_inode=unavailable; start_bytes=unavailable; anchor_start=unavailable; anchor_length=unavailable; anchor_hash=unavailable
          context="${ANYTYPE_API_LIVE_EVIDENCE_CONTEXT:-}"
          if [[ -r "$context" ]]; then
            while IFS= read -r line; do
              case "$line" in run_marker=[0-9a-f][0-9a-f]*) marker="${line#run_marker=}" ;; start_device=[0-9]*) start_device="${line#start_device=}" ;; start_inode=[0-9]*) start_inode="${line#start_inode=}" ;; start_bytes=[0-9]*) start_bytes="${line#start_bytes=}" ;; anchor_start=[0-9]*) anchor_start="${line#anchor_start=}" ;; anchor_length=[0-9]*) anchor_length="${line#anchor_length=}" ;; anchor_hash=[0-9a-f]*) anchor_hash="${line#anchor_hash=}" ;; esac
            done < "$context"
          fi
          {
            printf 'anytype-api live-gate reviewed failure evidence\nrun-marker=%s\nstart-bytes=%s\n' "$marker" "$start_bytes"
            source="${ANY_MCP_HEADLESS_REDACTED_LOG_FILE:-}"
            if [[ "$source" != /* || ! -r "$source" ]]; then
              printf 'reviewed-source=unavailable\n'
            else
              exec {reviewed_fd}<"$source"
              if test -f "/proc/self/fd/$reviewed_fd"; then
                IFS='|' read -r current_device current_inode current_bytes < <(stat -Lc '%d|%i|%s' "/proc/self/fd/$reviewed_fd")
              else
                current_device=unavailable; current_inode=unavailable; current_bytes=unavailable
              fi
              current_anchor_hash="$(tail -c "+$((anchor_start + 1))" -- "/proc/self/fd/$reviewed_fd" 2>/dev/null | head -c "$anchor_length" | sha256sum | cut -d ' ' -f 1)"
              if [[ "$start_device" == "$current_device" && "$start_inode" == "$current_inode" && "$start_bytes" =~ ^[0-9]+$ && "$anchor_start" =~ ^[0-9]+$ && "$anchor_length" =~ ^[0-9]+$ && "$anchor_hash" =~ ^[0-9a-f]{64}$ && "$current_bytes" =~ ^[0-9]+$ && "$current_bytes" -ge "$start_bytes" && "$current_anchor_hash" == "$anchor_hash" ]]; then
                printf 'reviewed-source=fresh-window\n'
                tail -c "+$((start_bytes + 1))" -- "/proc/self/fd/$reviewed_fd" 2>/dev/null | tail -c 65000 2>/dev/null || true
              else
                printf 'reviewed-source=rotated-or-replaced-or-pre-marker-failure\n'
                tail -c 65000 -- "/proc/self/fd/$reviewed_fd" 2>/dev/null || true
              fi
              exec {reviewed_fd}<&-
            fi
          } > "$artifact"
          chmod 0600 "$artifact"
          printf 'ANYTYPE_API_LIVE_FAILURE_EVIDENCE=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Retain bounded reviewed server evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anytype-api-required-server-log
          path: ${{ env.ANYTYPE_API_LIVE_FAILURE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7

  headless-soak:
    name: scheduled disposable characterization tier
    if: ${{ inputs.tier == 'soak' || inputs.tier == 'all' || github.event.schedule == '43 3 * * 0' }}
    needs: ignored-test-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Later steps need the pinned toolchain, python, and anytype-cli outside
      # a `nix develop` wrapper, so the devshell PATH is promoted to the job.
      - name: Expose pinned devshell tools to the job
        run: |
          nix develop --command bash -euo pipefail -c '
            {
              printf "PATH=%s\n" "$PATH"
              printf "PROTOC=%s\n" "$PROTOC"
              printf "PROTOC_INCLUDE=%s\n" "$PROTOC_INCLUDE"
            } >> "$GITHUB_ENV"
          '
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-headless
      # Space sharing calls Heart's coordinator service, so this small,
      # cleanup-owned tier cannot use the outbound-blocked server mode.
      - name: Provision a connected headless server with ephemeral credentials
        shell: bash
        env:
          ANYTYPE_HEADLESS_NETWORK_MODE: connected
        run: bash .github/scripts/provision-headless-server.sh ANY_MCP_HEADLESS
      - name: Run soak disposable ignored tests serially
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a; source "$ANY_MCP_HEADLESS_ENV_FILE"; set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;; esac
