name: anytype-api live

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/anytype-api-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anytype-api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/anytype-api-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anytype-api/**"

permissions:
  contents: read

jobs:
  ignored-test-inventory:
    name: disposable ignored-test inventory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: anytype-api-inventory

      - name: Verify the closed ignored-test inventory
        run: cargo test --locked -p anytype --test live_gate_manifest

  headless-required:
    name: protected disposable required tier
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 45
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: anytype-api-headless

      - name: Run required disposable ignored tests serially
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE"
          test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix"
          test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*)
              printf '%s\n' "ANYTYPE_TEST_SPACE_PREFIX must use 1..485 ASCII letters, digits, hyphens, or underscores" >&2
              exit 1
              ;;
          esac
          unset test_prefix
          reviewed_source="$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          umask 077
          reviewed_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-reviewed-XXXXXX")"
          reviewed_log="$reviewed_dir/server-events.jsonl"
          cp -- "$reviewed_source" "$reviewed_log"
          chmod 0600 "$reviewed_log"
          run_marker="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#run_marker}" -eq 64
          printf '\nanytype-api-run-marker=%s\n' "$run_marker" >> "$reviewed_log"
          export ANY_MCP_HEADLESS_REDACTED_LOG_FILE="$reviewed_log"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          printf 'ANY_MCP_HEADLESS_REDACTED_LOG_FILE=%s\n' "$reviewed_log" >> "$GITHUB_ENV"
          cargo run --locked -q -p anyr -- auth status --pretty
          python3 - required "$GITHUB_WORKSPACE/anytype-api/tests/live-gate-manifest.toml" > "$reviewed_dir/required.tsv" <<'PY'
          import sys
          import tomllib

          tier, path = sys.argv[1:]
          with open(path, "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          for entry in manifest[tier]:
              print(f"{entry['target']}\t{entry['test']}")
          PY
          while IFS=$'\t' read -r target test_name; do
            output="$reviewed_dir/${target}-${test_name}.log"
            set +e
            if [[ "$target" == "lib" ]]; then
              cargo test --locked -p anytype --lib "$test_name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$output"
            else
              cargo test --locked -p anytype --test "$target" "$test_name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$output"
            fi
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -ne 0 ]]; then
              rm -f -- "$output"
              exit "$status"
            fi
            if ! grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$output"; then
              rm -f -- "$output"
              printf '%s\n' "live gate did not execute exactly one test: $target::$test_name" >&2
              exit 1
            fi
            if grep -Fqi "skipped" "$output"; then
              rm -f -- "$output"
              printf '%s\n' "live gate reported skipped admission: $target::$test_name" >&2
              exit 1
            fi
            rm -f -- "$output"
          done < "$reviewed_dir/required.tsv"

      - name: Retain redacted headless server evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anytype-api-required-server-log
          path: ${{ env.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
          if-no-files-found: warn
          retention-days: 7

  headless-soak:
    name: scheduled disposable characterization tier
    if: github.event_name == 'schedule'
    environment: anytype-headless
    runs-on:
      - self-hosted
      - linux
      - anytype-headless
    timeout-minutes: 45
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: anytype-api-headless

      - name: Provision a clean isolated headless server
        shell: bash
        env:
          ANY_MCP_HEADLESS_RESET_SCRIPT: ${{ vars.ANY_MCP_HEADLESS_RESET_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test "${ANY_MCP_HEADLESS_RESET_SCRIPT#/}" != "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test -x "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          "$ANY_MCP_HEADLESS_RESET_SCRIPT"

      - name: Run soak disposable ignored tests serially
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE"
          test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a
          source "$ANY_MCP_HEADLESS_ENV_FILE"
          set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix"
          test "${#test_prefix}" -le 485
          case "$test_prefix" in
            *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*)
              printf '%s\n' "ANYTYPE_TEST_SPACE_PREFIX must use 1..485 ASCII letters, digits, hyphens, or underscores" >&2
              exit 1
              ;;
          esac
          unset test_prefix
          reviewed_source="$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          umask 077
          reviewed_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-reviewed-XXXXXX")"
          reviewed_log="$reviewed_dir/server-events.jsonl"
          cp -- "$reviewed_source" "$reviewed_log"
          chmod 0600 "$reviewed_log"
          run_marker="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#run_marker}" -eq 64
          printf '\nanytype-api-run-marker=%s\n' "$run_marker" >> "$reviewed_log"
          export ANY_MCP_HEADLESS_REDACTED_LOG_FILE="$reviewed_log"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          printf 'ANY_MCP_HEADLESS_REDACTED_LOG_FILE=%s\n' "$reviewed_log" >> "$GITHUB_ENV"
          cargo run --locked -q -p anyr -- auth status --pretty
          python3 - soak "$GITHUB_WORKSPACE/anytype-api/tests/live-gate-manifest.toml" > "$reviewed_dir/soak.tsv" <<'PY'
          import sys
          import tomllib

          tier, path = sys.argv[1:]
          with open(path, "rb") as manifest_file:
              manifest = tomllib.load(manifest_file)
          for entry in manifest[tier]:
              print(f"{entry['target']}\t{entry['test']}")
          PY
          while IFS=$'\t' read -r target test_name; do
            output="$reviewed_dir/${target}-${test_name}.log"
            set +e
            if [[ "$target" == "lib" ]]; then
              cargo test --locked -p anytype --lib "$test_name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$output"
            else
              cargo test --locked -p anytype --test "$target" "$test_name" -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$output"
            fi
            status="${PIPESTATUS[0]}"
            set -e
            if [[ "$status" -ne 0 ]]; then
              rm -f -- "$output"
              exit "$status"
            fi
            if ! grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$output"; then
              rm -f -- "$output"
              printf '%s\n' "live gate did not execute exactly one test: $target::$test_name" >&2
              exit 1
            fi
            if grep -Fqi "skipped" "$output"; then
              rm -f -- "$output"
              printf '%s\n' "live gate reported skipped admission: $target::$test_name" >&2
              exit 1
            fi
            rm -f -- "$output"
          done < "$reviewed_dir/soak.tsv"

      - name: Retain redacted headless server evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: anytype-api-soak-server-log
          path: ${{ env.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
          if-no-files-found: warn
          retention-days: 7
