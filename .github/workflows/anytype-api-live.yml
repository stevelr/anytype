name: anytype-api live

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/anytype-api-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anytype-api/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/anytype-api-live.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "anytype-api/**"

permissions:
  contents: read

jobs:
  ignored-test-inventory:
    name: disposable ignored-test inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-inventory
      - name: Verify the closed ignored-test inventory and workflow policy
        run: cargo test --locked -p anytype --test live_gate_manifest

  headless-required:
    name: protected disposable required tier
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: ignored-test-inventory
    environment: anytype-headless
    runs-on: [ self-hosted, linux, anytype-headless ]
    timeout-minutes: 45
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-headless
      - name: Run required disposable ignored tests serially
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a; source "$ANY_MCP_HEADLESS_ENV_FILE"; set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;; esac
          test "${ANYTYPE_KEYSTORE:-}" = env
          test -n "${ANYTYPE_KEYSTORE_SERVICE:-}" && test "${#ANYTYPE_KEYSTORE_SERVICE}" -le 128
          case "$ANYTYPE_KEYSTORE_SERVICE" in [!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]*) exit 1 ;; esac
          case "${ANYTYPE_KEYSTORE_SERVICE:1}" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_.-]*) exit 1 ;; esac
          test -n "${ANYTYPE_KEY_HTTP_TOKEN:-}"
          test -n "${ANYTYPE_KEY_SESSION_TOKEN:-${ANYTYPE_KEY_ACCOUNT_KEY:-}}"
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-evidence-XXXXXX")"
          start_bytes="$(wc -c < "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE")"
          case "$start_bytes" in *[!0-9]*|'') exit 1 ;; esac
          run_marker="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#run_marker}" -eq 64
          context="$evidence_dir/context"
          printf 'run_marker=%s\nstart_bytes=%s\n' "$run_marker" "$start_bytes" > "$context"
          chmod 0600 "$context"
          printf 'ANYTYPE_API_LIVE_EVIDENCE_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          python3 anytype-api/scripts/run-live-gate.py required anytype-api/tests/live-gate-manifest.toml
      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        env:
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set +e
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-failure-XXXXXX" 2>/dev/null)" || exit 1
          artifact="$evidence_dir/reviewed-server-events.txt"
          marker=unavailable; start_bytes=unavailable
          context="${ANYTYPE_API_LIVE_EVIDENCE_CONTEXT:-}"
          if [[ -r "$context" ]]; then
            while IFS= read -r line; do
              case "$line" in run_marker=[0-9a-f][0-9a-f]*) marker="${line#run_marker=}" ;; start_bytes=[0-9]*) start_bytes="${line#start_bytes=}" ;; esac
            done < "$context"
          fi
          {
            printf 'anytype-api live-gate reviewed failure evidence\nrun-marker=%s\nstart-bytes=%s\n' "$marker" "$start_bytes"
            source="$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
            if [[ "$source" != /* || ! -r "$source" ]]; then
              printf 'reviewed-source=unavailable\n'
            else
              current_bytes="$(wc -c < "$source" 2>/dev/null)"
              if [[ "$start_bytes" =~ ^[0-9]+$ && "$current_bytes" =~ ^[0-9]+$ && "$current_bytes" -ge "$start_bytes" ]]; then
                printf 'reviewed-source=fresh-window\n'
                tail -c "+$((start_bytes + 1))" -- "$source" 2>/dev/null | tail -c 65000 2>/dev/null || true
              else
                printf 'reviewed-source=rotated-or-pre-marker-failure\n'
                tail -c 65000 -- "$source" 2>/dev/null || true
              fi
            fi
          } > "$artifact"
          chmod 0600 "$artifact"
          printf 'ANYTYPE_API_LIVE_FAILURE_EVIDENCE=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Retain bounded reviewed server evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anytype-api-required-server-log
          path: ${{ env.ANYTYPE_API_LIVE_FAILURE_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 7

  headless-soak:
    name: scheduled disposable characterization tier
    if: github.event_name == 'schedule'
    needs: ignored-test-inventory
    environment: anytype-headless
    runs-on: [ self-hosted, linux, anytype-headless ]
    timeout-minutes: 45
    concurrency:
      group: anytype-headless-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: anytype-api-headless
      - name: Provision a clean isolated headless server
        shell: bash
        env:
          ANY_MCP_HEADLESS_RESET_SCRIPT: ${{ vars.ANY_MCP_HEADLESS_RESET_SCRIPT }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test "${ANY_MCP_HEADLESS_RESET_SCRIPT#/}" != "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          test -x "$ANY_MCP_HEADLESS_RESET_SCRIPT"
          "$ANY_MCP_HEADLESS_RESET_SCRIPT"
      - name: Run soak disposable ignored tests serially
        shell: bash
        env:
          ANY_MCP_HEADLESS_ENV_FILE: ${{ vars.ANY_MCP_HEADLESS_ENV_FILE }}
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set -euo pipefail
          test -n "$ANY_MCP_HEADLESS_ENV_FILE" && test -r "$ANY_MCP_HEADLESS_ENV_FILE"
          test -n "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test "${ANY_MCP_HEADLESS_REDACTED_LOG_FILE#/}" != "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          test -r "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
          set -a; source "$ANY_MCP_HEADLESS_ENV_FILE"; set +a
          export ANYTYPE_DISPOSABLE_TEST_PROCESS=1
          test_prefix="${ANYTYPE_TEST_SPACE_PREFIX:-}"
          test -n "$test_prefix" && test "${#test_prefix}" -le 485
          case "$test_prefix" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-]*) exit 1 ;; esac
          test "${ANYTYPE_KEYSTORE:-}" = env
          test -n "${ANYTYPE_KEYSTORE_SERVICE:-}" && test "${#ANYTYPE_KEYSTORE_SERVICE}" -le 128
          case "$ANYTYPE_KEYSTORE_SERVICE" in [!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]*) exit 1 ;; esac
          case "${ANYTYPE_KEYSTORE_SERVICE:1}" in *[!abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_.-]*) exit 1 ;; esac
          test -n "${ANYTYPE_KEY_HTTP_TOKEN:-}"
          test -n "${ANYTYPE_KEY_SESSION_TOKEN:-${ANYTYPE_KEY_ACCOUNT_KEY:-}}"
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-evidence-XXXXXX")"
          start_bytes="$(wc -c < "$ANY_MCP_HEADLESS_REDACTED_LOG_FILE")"
          case "$start_bytes" in *[!0-9]*|'') exit 1 ;; esac
          run_marker="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          test "${#run_marker}" -eq 64
          context="$evidence_dir/context"
          printf 'run_marker=%s\nstart_bytes=%s\n' "$run_marker" "$start_bytes" > "$context"
          chmod 0600 "$context"
          printf 'ANYTYPE_API_LIVE_EVIDENCE_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          python3 anytype-api/scripts/run-live-gate.py soak anytype-api/tests/live-gate-manifest.toml
      - name: Capture bounded reviewed server evidence on failure
        if: failure()
        shell: bash
        env:
          ANY_MCP_HEADLESS_REDACTED_LOG_FILE: ${{ vars.ANY_MCP_HEADLESS_REDACTED_LOG_FILE }}
        run: |
          set +e
          umask 077
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/anytype-api-failure-XXXXXX" 2>/dev/null)" || exit 1
          artifact="$evidence_dir/reviewed-server-events.txt"
          marker=unavailable; start_bytes=unavailable
          context="${ANYTYPE_API_LIVE_EVIDENCE_CONTEXT:-}"
          if [[ -r "$context" ]]; then
            while IFS= read -r line; do
              case "$line" in run_marker=[0-9a-f][0-9a-f]*) marker="${line#run_marker=}" ;; start_bytes=[0-9]*) start_bytes="${line#start_bytes=}" ;; esac
            done < "$context"
          fi
          {
            printf 'anytype-api live-gate reviewed failure evidence\nrun-marker=%s\nstart-bytes=%s\n' "$marker" "$start_bytes"
            source="$ANY_MCP_HEADLESS_REDACTED_LOG_FILE"
            if [[ "$source" != /* || ! -r "$source" ]]; then
