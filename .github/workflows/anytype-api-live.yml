          printf 'ANYTYPE_API_LIVE_EVIDENCE_CONTEXT=%s\n' "$context" >> "$GITHUB_ENV"
          export ANY_MCP_HEADLESS_LOG_RUN_MARKER="$run_marker"
          export ANYTYPE_API_GATE_OUTPUT="$RUNNER_TEMP/anytype-api-gate-output.log"
          python3 anytype-api/scripts/run-live-gate.py soak anytype-api/tests/live-gate-manifest.toml
